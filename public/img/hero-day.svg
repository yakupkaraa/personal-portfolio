<path d="M0 580 L0 500 Q636 390 1272 500 L1272 580Z" fill="url(#lground)"/>
<g fill="#6E3216" opacity="0.35">
<ellipse cx="200" cy="535" rx="60" ry="10"/><ellipse cx="520" cy="505" rx="42" ry="7"/><ellipse cx="1000" cy="525" rx="70" ry="11"/><ellipse cx="1130" cy="555" rx="48" ry="8"/><ellipse cx="360" cy="560" rx="34" ry="6"/>
</g>
<rect x="779" y="250" width="5" height="208" rx="2" fill="#F4F1EC"/>
<path d="M784 256 H854 L842 278 L854 300 H784Z" fill="#14233F"/>
<circle cx="804" cy="278" r="9" fill="#F2A862"/>
<ellipse cx="620" cy="452" rx="62" ry="9" fill="#6E3216" opacity="0.4"/>
<g transform="translate(520 192)"><g>
<rect x="38" y="78" width="124" height="112" rx="28" fill="#CFC9BF"/>
<g transform="rotate(3 80 186)"><rect x="62" y="178" width="36" height="66" rx="17" fill="#F4F1EC"/><rect x="58" y="232" width="44" height="24" rx="10" fill="#F2A862"/></g>
<g transform="rotate(-3 120 186)"><rect x="102" y="178" width="36" height="66" rx="17" fill="#F4F1EC"/><rect x="98" y="232" width="44" height="24" rx="10" fill="#F2A862"/></g>
<rect x="56" y="84" width="88" height="104" rx="34" fill="#F4F1EC"/>
<rect x="56" y="142" width="88" height="9" fill="#F2A862" opacity="0.9"/>
