<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1272 580" preserveAspectRatio="xMidYMid slice" width="1272" height="580">
<style>
@keyframes wave{0%{transform:rotate(0)}4%{transform:rotate(-22deg)}9%{transform:rotate(18deg)}14%{transform:rotate(-22deg)}19%{transform:rotate(18deg)}24%{transform:rotate(-18deg)}29%{transform:rotate(10deg)}34%,100%{transform:rotate(0)}}
.wave{transform-origin:68px 102px;animation:wave 8s ease-in-out .6s infinite}
@keyframes float{0%,100%{transform:translate(0,8px) rotate(-2.5deg)}50%{transform:translate(10px,-16px) rotate(2.5deg)}}
.float{transform-origin:582px 266px;animation:float 7s ease-in-out infinite}
@keyframes sdrift1{from{transform:translate(0,0)}to{transform:translate(-60px,10px)}}
@keyframes sdrift2{from{transform:translate(0,0)}to{transform:translate(-110px,18px)}}
.sd1{animation:sdrift1 24s ease-in-out infinite alternate}
.sd2{animation:sdrift2 36s ease-in-out infinite alternate}
@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:1}}
.tw{animation:twinkle 3.4s ease-in-out infinite}
@keyframes shoot1{0%{transform:translate(1010px,40px);opacity:0}1.5%{opacity:1}7%{transform:translate(610px,270px);opacity:0}100%{transform:translate(610px,270px);opacity:0}}
@keyframes shoot2{0%{transform:translate(520px,30px);opacity:0}1.5%{opacity:1}6%{transform:translate(220px,200px);opacity:0}100%{transform:translate(220px,200px);opacity:0}}
.shoot1{opacity:0;animation:shoot1 9s linear 2s infinite}
.shoot2{opacity:0;animation:shoot2 13s linear 7s infinite}
@keyframes pd1{from{transform:translate(0,0)}to{transform:translate(-90px,26px)}}
@keyframes pd2{from{transform:translate(0,0)}to{transform:translate(80px,-16px)}}
@keyframes pd3{from{transform:translate(0,0)}to{transform:translate(-60px,24px)}}
@keyframes pd4{from{transform:translate(0,0)}to{transform:translate(-70px,-20px)}}
@keyframes pd5{from{transform:translate(0,0)}to{transform:translate(60px,18px)}}
.pd1{animation:pd1 26s ease-in-out infinite alternate}
.pd2{animation:pd2 30s ease-in-out infinite alternate}
.pd3{animation:pd3 22s ease-in-out infinite alternate}
.pd4{animation:pd4 28s ease-in-out infinite alternate}
.pd5{animation:pd5 24s ease-in-out infinite alternate}
@keyframes sunpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.sunpulse{transform-origin:900px 200px;animation:sunpulse 12s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.wave,.float,.sd1,.sd2,.tw,.shoot1,.shoot2,.pd1,.pd2,.pd3,.pd4,.pd5,.sunpulse,.tw2,.dust,.orb,.sat1,.com1{animation:none !important}}
@keyframes twinkle2{0%,100%{opacity:.2}50%{opacity:.85}}
.tw2{animation:twinkle2 8s ease-in-out infinite}
/* LIGHT-DUST */
@keyframes dustup{0%{transform:translate(0,0);opacity:0}20%{opacity:1}80%{opacity:1}100%{transform:translate(-16px,-130px);opacity:0}}
.dust{animation:dustup 22s linear infinite}
/* /LIGHT-DUST */
/* LIGHT-ORBITS */
@keyframes orbit{to{transform:rotate(360deg)}}
.orb{transform-box:view-box;animation:orbit 150s linear infinite}
/* /LIGHT-ORBITS */
/* LIGHT-FLYBY */
@keyframes sat1{0%{transform:translate(1340px,70px) rotate(-6deg)}38%,100%{transform:translate(-100px,160px) rotate(8deg)}}
.sat1{transform:translate(1340px,70px);animation:sat1 34s linear 4s infinite}
@keyframes com1{0%{transform:translate(1200px,20px);opacity:0}2%{opacity:1}14%{transform:translate(620px,180px);opacity:0}100%{transform:translate(620px,180px);opacity:0}}
.com1{opacity:0;animation:com1 26s linear 9s infinite}
/* /LIGHT-FLYBY */
</style>
<defs>
<linearGradient id="lsky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFEBD3"/><stop offset="1" stop-color="#F5BD8A"/></linearGradient>
<radialGradient id="lpl" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#E3ECFA"/><stop offset="0.6" stop-color="#9DB6E0"/><stop offset="1" stop-color="#5E78B0"/></radialGradient>
<radialGradient id="lpl2" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#FFF1DE"/><stop offset="0.6" stop-color="#F0A25C"/><stop offset="1" stop-color="#C8662B"/></radialGradient>
<linearGradient id="lground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E58C4A"/><stop offset="1" stop-color="#9C4A1C"/></linearGradient>
<linearGradient id="ctail" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="130" y2="-37"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
</defs>
<rect width="1272" height="580" fill="url(#lsky)"/>
<g class="sunpulse"><circle cx="900" cy="200" r="170" fill="#FFF7EA" opacity="0.35"/>
<circle cx="900" cy="200" r="120" fill="#FFF7EA" opacity="0.8"/></g>
<g fill="#FFFFFF" opacity="0.85"><circle class="tw" style="animation-delay: -0.0s" cx="130" cy="160" r="2"/><circle class="tw" style="animation-delay: -0.7s" cx="330" cy="70" r="1.6"/><circle class="tw" style="animation-delay: -1.4s" cx="520" cy="120" r="2"/><circle class="tw" style="animation-delay: -2.1s" cx="650" cy="50" r="1.6"/><circle class="tw" style="animation-delay: -2.8s" cx="1180" cy="70" r="1.8"/><circle class="tw" style="animation-delay: -3.5s" cx="250" cy="210" r="1.5"/><circle class="tw" style="animation-delay: -4.2s" cx="1230" cy="300" r="1.6"/><circle class="tw" style="animation-delay: -4.9s" cx="60" cy="340" r="1.8"/></g>
<g>
<g transform="rotate(-18 1040 110)"><path d="M990 110 A50 12 0 0 1 1090 110" fill="none" stroke="#5E78B0" stroke-width="5" opacity="0.8"/></g>
<circle cx="1040" cy="110" r="30" fill="url(#lpl)"/>
<g transform="rotate(-18 1040 110)"><path d="M990 110 A50 12 0 0 0 1090 110" fill="none" stroke="#5E78B0" stroke-width="5"/></g>
</g>
<!-- LIGHT-FLYBY -->
<g class="sat1"><g><rect x="-34" y="-4" width="24" height="8" rx="1.5" fill="#5E78B0"/><path d="M-26 -4V4M-18 -4V4" stroke="#E3ECFA" stroke-width="1"/><rect x="10" y="-4" width="24" height="8" rx="1.5" fill="#5E78B0"/><path d="M18 -4V4M26 -4V4" stroke="#E3ECFA" stroke-width="1"/><rect x="-10" y="-7" width="20" height="14" rx="4" fill="#F4F1EC" stroke="#D9D4CC" stroke-width="1.5"/><path d="M0 -7V-16" stroke="#D9D4CC" stroke-width="1.5" stroke-linecap="round"/><circle cx="0" cy="-17" r="2.5" fill="#F2A862"/><circle cx="0" cy="0" r="3" fill="#14233F"/></g></g>
<g class="com1"><line x1="0" y1="0" x2="130" y2="-37" stroke="url(#ctail)" stroke-width="5" stroke-linecap="round"/><circle r="4.5" fill="#FFFFFF"/><circle r="9" fill="#FFFFFF" opacity="0.35"/></g>
<!-- /LIGHT-FLYBY -->
<circle cx="150" cy="125" r="26" fill="url(#lpl2)"/>
<circle cx="560" cy="85" r="14" fill="url(#lpl)"/>
